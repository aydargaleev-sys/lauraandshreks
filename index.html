<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Лаура vs Шрек: Обнимашки</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1b0b3a;--tx:#fdf6e3;--ac:#ffcf33;--b1:#78b83c;--b2:#4f8a27;--ed:#2f5a16}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b0b3a;--tx:#fdf6e3}}
:root[data-theme="dark"]{--bg:#1b0b3a;--tx:#fdf6e3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{margin:0;color:var(--tx);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 8px 18px;background:linear-gradient(#12062b 0%,#3a1060 55%,#ff5fa8 100%) fixed}
body:before{content:"";position:fixed;left:-50%;right:-50%;bottom:0;height:42%;background:repeating-linear-gradient(90deg,#ff9fd055 0 2px,transparent 2px 56px),repeating-linear-gradient(0deg,#ff9fd055 0 2px,transparent 2px 34px);transform:perspective(260px) rotateX(58deg);transform-origin:bottom;z-index:-1}
#gb{position:relative;width:min(100%,520px);background:linear-gradient(160deg,var(--b1),var(--b2));border:4px solid var(--ed);border-radius:18px 18px 64px 18px;padding:10px 12px 18px;box-shadow:0 0 0 3px #12062b,0 10px 0 3px #12062b,0 0 46px #ff5fa899}
#gb:before,#gb:after{content:"";position:absolute;top:-24px;width:58px;height:36px;background:radial-gradient(ellipse at 50% 85%,#f0a9a0 0 32%,var(--b1) 34%);border:4px solid var(--ed);border-radius:60% 60% 20% 20%;z-index:-1}
#gb:before{left:9%;transform:rotate(-24deg)}#gb:after{right:9%;transform:rotate(24deg)}
.stripe{height:7px;border-radius:4px;background:linear-gradient(90deg,#ff3d9a 0 33.3%,#ffcf33 33.3% 66.6%,#2ee6ff 66.6%);margin-bottom:8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;color:#12062b}
.brand b{font-size:14px;font-style:italic;color:#fff;text-shadow:2px 2px 0 #12062b,-1px -1px 0 #ff3d9a}.brand span{font-size:6px;line-height:1.5;text-align:right}
#main{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"bez bez bez" "dp . ab";gap:14px 8px;align-items:center}
#bez{grid-area:bez;position:relative;background:#3a2a52;border:3px solid #1d1230;border-radius:10px 10px 34px 10px;padding:12px 12px 6px}
.led{position:absolute;left:5px;top:42%;width:5px;height:5px;border-radius:50%;background:#ff3030;box-shadow:0 0 6px #ff3030}
#w{touch-action:none;position:relative;background:#000;border:3px solid #000;width:100%;margin:0 auto;overflow:hidden}
#w:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0003 0 1px,transparent 1px 3px)}
canvas{width:100%;display:block;image-rendering:pixelated;background:#2a1636}
.dm{font-size:5px;color:#b9a7d6;text-align:center;margin:6px 0 2px;letter-spacing:.5px}
#dp{grid-area:dp;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.d{background:#2a2433;border:0;color:#9d94b3;font:inherit;font-size:14px;touch-action:none;padding:0}
#bu{grid-area:1/2;border-radius:9px 9px 0 0}.d.l{grid-area:2/1;border-radius:9px 0 0 9px}.d.r{grid-area:2/3;border-radius:0 9px 9px 0}.d.dc{grid-area:2/2}#bd{grid-area:3/2;border-radius:0 0 9px 9px}
#bu:active,#bd:active{background:#4a4060}
#ab{grid-area:ab;display:flex;align-items:flex-end;gap:12px}.bw{display:flex;flex-direction:column;align-items:center;gap:5px}.bw.up{margin-bottom:24px}.bw small,#ss small{font-size:6px;color:#12062b}
.ab{width:64px;height:64px;border-radius:50%;border:0;font:inherit;font-size:15px;color:#fff;background:#d6338a;box-shadow:0 5px 0 #0005,inset 0 -5px 0 #0003;touch-action:none}
#bb{background:#9be04a;color:#12062b}.ab:active{transform:translateY(4px);box-shadow:0 1px 0 #0005}
#ss{display:flex;justify-content:center;gap:26px;margin-top:12px}.sw{display:flex;flex-direction:column;align-items:center;gap:4px}
.pill{width:56px;height:16px;border-radius:9px;border:0;background:#8a8f9c;box-shadow:0 3px 0 #0004;touch-action:none}.pill:active{transform:translateY(2px)}.pill.off{background:#d6455d}
.spk{position:absolute;right:16px;bottom:10px;width:50px;height:30px;background:repeating-linear-gradient(-30deg,var(--ed) 0 4px,transparent 4px 9px);border-radius:6px;opacity:.6;pointer-events:none}
@media (min-width:760px) and (min-aspect-ratio:3/2){
 #gb{width:min(100%,1060px);padding:12px 22px 20px;border-radius:22px 22px 80px 22px}
 #main{grid-template-columns:150px minmax(0,1fr) 150px;grid-template-areas:"dp bez ab"}
 #dp{justify-self:center}#ab{justify-self:center}
 #w{width:min(100%,calc((100vh - 230px)*1.7778))}.brand b{font-size:18px}.brand span{font-size:8px}.dm{font-size:7px}}
@media (max-width:520px){#dp{grid-template-columns:repeat(3,clamp(46px,15vw,66px));grid-template-rows:repeat(3,clamp(46px,15vw,66px))}.ab{width:clamp(64px,21vw,88px);height:clamp(64px,21vw,88px);font-size:18px}.bw.up{margin-bottom:30px}#main{gap:26px 8px}.pill{width:64px;height:20px}#ss{margin-top:18px}}
@media (max-height:520px){body{padding:8px}.brand,.stripe,.dm,#ss small,.spk{display:none}#gb:before,#gb:after{display:none}#gb{padding:8px 12px}#ss{margin-top:6px}#w{width:min(100%,calc((100vh - 110px)*1.7778))}}
.pb{font:inherit;font-size:11px;background:var(--ac);color:#2a1636;border:3px solid #000;box-shadow:0 4px 0 #000;padding:14px 8px;cursor:pointer;touch-action:none}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
#ov{position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#ov[hidden]{display:none}
.box{max-width:420px;width:100%;text-align:center;font-size:10px;line-height:1.7}
.box .pb{width:100%;margin:6px 0}
.box img{width:100%;image-rendering:pixelated;border:4px solid #000;margin-bottom:10px}
.box h2{font-size:14px;color:var(--ac);margin:8px 0}
</style></head><body>

<div class="stripe"></div><div class="brand"><b>ШРЕК-БОЙ</b><span>ЛАУРА ЛЮБИТ ШРЕКА<br>PIXEL EDITION</span></div>

<div id="ab"><div class="bw"><button class="ab" id="bb">B</button><small>ШРЕК!</small></div><div class="bw up"><button class="ab" id="bj">A</button><small>ПРЫЖОК</small></div></div>
